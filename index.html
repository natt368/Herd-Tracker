/* Age comes from the year letter (North American system: I, O, Q, U, V are skipped, so 21 letters,
   A = 2013 … N = 2025, P = 2026, repeating every 21 years). The date of birth is kept for reference
   (and weaning, which needs the exact day) but isn't used for age. */
var YEAR_LETTERS = 'ABCDEFGHJKLMNPRSTWXYZ';
function yearFromLetter(letter){
  const i = YEAR_LETTERS.indexOf(String(letter||'').trim().toUpperCase());
  if(i < 0 || String(letter||'').trim().length !== 1) return null;
  const now = new Date().getFullYear();
  let y = 2013 + i;
  while(y > now) y -= YEAR_LETTERS.length;
  while(y + YEAR_LETTERS.length <= now) y += YEAR_LETTERS.length;
  return y;
}
// The year letter for a birth year / date (inverse of yearFromLetter).
function letterForYear(y){
  y = Number(y);
  if(!y) return '';
  const n = YEAR_LETTERS.length;
  return YEAR_LETTERS[(((y - 2013) % n) + n) % n];
}
function letterForDate(dob){ const m = /^(\d{4})-/.exec(String(dob||'')); return m ? letterForYear(m[1]) : ''; }
function ageYears(a){ const y = yearFromLetter(a && a.yearLetter); return y===null ? null : new Date().getFullYear() - y; }
// When the birthday moves to a different year, the year letter (which sets the age) follows it.
function syncYearLetterFromDob(input){
  const form = input.form;
  const letter = letterForDate(input.value);
  const note = document.getElementById('dob-letter-note');
  if(!form || !letter) return;
  const box = form.yearLetter;
  const current = String(box.value||'').trim().toUpperCase();
  if(current === letter) return;
  box.value = letter;
  box.dispatchEvent(new Event('input'));
  if(note) note.textContent = current ? `Year letter changed from ${current} to ${letter} to match.` : `Year letter set to ${letter}.`;
}
/* Animals whose birthday year disagrees with their year letter. The letter is trusted (it sets the age),
   so the fix moves the birthday to Feb 1 of the letter's year. */
function birthdayMismatches(){
  return state.animals.filter(a=>{
    const y = yearFromLetter(a.yearLetter);
    const m = /^(\d{4})-/.exec(String(a.dob||''));
    return y!==null && m && Number(m[1]) !== y;
  });
}
function openBirthdayFix(){
  const list = birthdayMismatches().sort(byName);
  if(!list.length){ toast('Every birthday already matches its year letter'); return; }
  const body = `
    <p class="hint" style="margin:0 0 12px; font-size:12.5px;">The year letter decides the age, so each birthday below moves to <b>Feb 1</b> of its letter's year. You can undo this right after.</p>
    <div style="border:1px solid var(--line-soft); border-radius:var(--radius); background:var(--white); max-height:380px; overflow-y:auto;">
      ${list.map(a=>`<div class="mini-row" style="padding:8px 10px;">
        <span>${eartag(a)} <span class="muted" style="font-size:11.5px;">letter ${escapeHtml(String(a.yearLetter).toUpperCase())}</span></span>
        <span class="d" style="white-space:nowrap;">${fmtDate(a.dob)} → <b>${fmtDate(yearFromLetter(a.yearLetter) + '-02-01')}</b></span>
      </div>`).join('')}
    </div>
    <div class="modal-actions">
      <button type="button" class="btn ghost" onclick="closeModal()">Cancel</button>
      <button type="button" class="btn rust" onclick="applyBirthdayFix()">Fix ${list.length} birthday${list.length===1?'':'s'}</button>
    </div>`;
  document.getElementById('modal-root').innerHTML = modalShell('Fix birthdays to match year letters', body);
}
function applyBirthdayFix(){
  const list = birthdayMismatches();
  const before = list.map(a=>({ id:a.id, dob:a.dob }));
  list.forEach(a=>{ a.dob = yearFromLetter(a.yearLetter) + '-02-01'; });
  saveState();
  closeModal();
  render();
  toastAction(`Fixed ${list.length} birthday${list.length===1?'':'s'} to Feb 1 of the year letter`, 'Undo', ()=>{
    before.forEach(b=>{ const a = animalById(b.id); if(a) a.dob = b.dob; });
    saveState();
    render();
    toast('Birthdays put back');
  }, 15000);
}
function yearLetterHint(letter){
  const l = String(letter||'').trim().toUpperCase();
  if(!l) return 'Sets the age.';
  const y = yearFromLetter(l);
  if(y===null) return 'Not a year letter (I, O, Q, U and V aren\'t used).';
  const n = new Date().getFullYear() - y;
  return `Born ${y} · ${n===0 ? 'this year' : n + (n===1 ? ' yr' : ' yrs')}`;
}
function ageText(a){
  const n = ageYears(a);
  if(n===null) return '—';
  return n===0 ? 'This year' : n + (n===1 ? ' yr' : ' yrs');
}
function summaryBucketsFor(animals){
  const g = summaryFilters.groupBy;
  const map = new Map();
  const put = (key, label, order, a)=>{ if(!map.has(key)) map.set(key, { key, label, order, animals: [] }); map.get(key).animals.push(a); };
  animals.forEach(a=>{
    if(g==='age'){
      const y = ageYears(a);
      if(y===null) put('none','No year letter', 999, a);
      else { const L = String(a.yearLetter).trim().toUpperCase(); put(String(y), `${y===0 ? 'Born this year' : y===1 ? '1 yr' : y+' yrs'} · ${L} (${yearFromLetter(L)})`, y, a); }
    } else if(g==='class'){ const c = classLabel(a); put(c, c, CLASSES.indexOf(a.klass)*2 + (c==='Open Heifer'?1:0), a); }
    else if(g==='pasture'){ const v = (a.pasture||'').trim(); put(v||'none', v||'No pasture', v? 0 : 1, a); }
    else if(g==='breed'){ const v = (a.breed||'').trim(); put(v||'none', v||'No breed', v? 0 : 1, a); }
    else if(g==='yearLetter'){ const v = String(a.yearLetter||'').trim().toUpperCase(); put(v||'none', v||'No year letter', v? 0 : 1, a); }
  });
  const list = [...map.values()];
  // Age and class keep their natural order; the others list the biggest groups first.
  if(g==='age' || g==='class') list.sort((x,y)=> x.order - y.order);
  else list.sort((x,y)=> x.order - y.order || y.animals.length - x.animals.length || x.label.localeCompare(y.label, undefined, { numeric:true }));
  return list;
}
function niceMax(v){
  if(v<=5) return Math.max(1, v);
  const pow = Math.pow(10, Math.floor(Math.log10(v)));
  for(const m of [1, 2, 2.5, 5, 10]) if(m*pow >= v) return m*pow;
  return 10*pow;
}
function summaryChartSvg(buckets){
  // Drawn at the real on-screen width (no viewBox scaling) so text and bars keep their size on any screen.
  const root = document.getElementById('view-root');
  const narrow = window.innerWidth < 640;
  const W = Math.max(260, Math.floor((root ? root.clientWidth : 640) - (narrow ? 34 : 46)));
  const rowH = 32, barH = 20, labelW = narrow ? 92 : 128, padR = 36, top = 22;
  const H = top + buckets.length*rowH + 8;
  const max = niceMax(Math.max(1, ...buckets.map(b=>b.animals.length)));
  const plotW = W - labelW - padR;
  const x = v=> labelW + (v/max)*plotW;
  // Whole-number ticks only: you can't have half a cow.
  const step = max<=5 ? 1 : max<=10 ? 2 : max/5;
  const ticks = []; for(let t=0; t<=max+1e-9; t+=step) ticks.push(Math.round(t));
  const r = 4;
  const bar = (b, i)=>{
    const y = top + i*rowH + (rowH-barH)/2, w = Math.max(0, x(b.animals.length) - labelW);
    // Square at the baseline, 4px rounded data end.
    const path = w<=0 ? '' : w<r ? `M${labelW},${y}h${w}v${barH}h${-w}z`
      : `M${labelW},${y}h${w-r}a${r},${r} 0 0 1 ${r},${r}v${barH-2*r}a${r},${r} 0 0 1 ${-r},${r}h${-(w-r)}z`;
    return `<g class="sum-row" tabindex="0" role="button" aria-label="${escapeHtml(b.label)}: ${b.animals.length} head"
        onmousemove="showSummaryTip(event, ${i})" onmouseleave="hideSummaryTip()" onfocus="showSummaryTip(event, ${i})" onblur="hideSummaryTip()"
        onclick="openSummaryBucket(${i})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault(); openSummaryBucket(${i});}" style="cursor:pointer;">
      <rect x="0" y="${top + i*rowH}" width="${W}" height="${rowH}" fill="transparent"></rect>
      <text x="${labelW-10}" y="${y+barH/2}" text-anchor="end" dominant-baseline="central" class="sum-label">${escapeHtml(b.label)}</text>
      ${path ? `<path d="${path}" class="sum-bar"></path>` : ''}
      <text x="${x(b.animals.length)+6}" y="${y+barH/2}" dominant-baseline="central" class="sum-value">${b.animals.length}</text>
    </g>`;
  };
  return `<svg width="${W}" height="${H}" role="img" aria-label="Head count by ${escapeHtml(summaryGroupLabel())}" style="display:block; max-width:100%;">
    ${ticks.map(t=>`<line x1="${x(t)}" x2="${x(t)}" y1="${top-6}" y2="${H-4}" class="sum-grid"></line><text x="${x(t)}" y="${top-10}" text-anchor="middle" class="sum-tick">${t}</text>`).join('')}
    ${buckets.map(bar).join('')}
  </svg>`;
}

function showSummaryTip(evt, i){
  const b = summaryBuckets[i], tip = document.getElementById('summary-tip');

  const total = summaryBuckets.reduce((s,x)=>s+x.animals.length, 0);

  tip.querySelector('.sum-tip-value').textContent = `${b.animals.length} head` + (total ? ` · ${Math.round(b.animals.length/total*100)}%` : '');
  tip.querySelector('.sum-tip-label').textContent = b.label;
  const panel = tip.parentElement.getBoundingClientRect();
  const target = evt.currentTarget.getBoundingClientRect();
  const px = evt.clientX ? evt.clientX : target.left + target.width/2;
  tip.style.display = 'block';
  tip.style.left = Math.min(panel.width - tip.offsetWidth - 8, Math.max(8, px - panel.left + 12)) + 'px';
  tip.style.top = (target.top - panel.top - tip.offsetHeight - 4) + 'px';
}

  const cowsWithout = state.animals.filter(a=> a.klass==='Cow' && isActive(a) && !calvesAtSideOf(a).length).length;
  const head = `
    <div class="section-title">Cow / calf pairs</div>
    <p class="section-desc">A cow is paired from the day she calves until her calf is weaned. Weaning is recorded by hand: tap <b>Wean</b> below, or log a Weaning event.</p>`;
  if(!pairs.length) return head + `<div class="empty-state"><div class="icon">🐮</div><h3>No pairs right now</h3><p>Log a <b>Calving</b> event for a cow and she'll show here with her calf until it's weaned.</p></div>`;
  return head + `
    <p class="hint" style="margin:-6px 0 14px;"><b>${pairs.length}</b> pair${pairs.length===1?'':'s'}${cowsWithout ? ` · ${cowsWithout} cow${cowsWithout===1?' has':'s have'} no calf at side` : ''}.</p>
    <div class="pair-grid">
      ${pairs.map(({dam, calves})=>`<div class="pair-card">
          <div class="cow-row">
            <div>${eartag(dam)}</div>
            <button class="btn ghost sm" onclick="openDrawer('${dam.id}')">Details</button>
          </div>
          <div class="pair-link">
            ${calves.map(calf=>{
              const days = ageInDays(calf.dob);
              return `<div class="calf-row">
                <div>
                  ${eartag(calf)} <span class="muted" style="font-size:11.5px;">${escapeHtml(calf.klass)}</span>
                  <div class="calf-meta">${calf.dob ? `Born ${fmtDate(calf.dob)}${days!==null ? ' · '+days+' day'+(days===1?'':'s')+' at side' : ''}` : 'Birth date not recorded'}</div>
                </div>
                <button class="btn ghost sm" onclick="weanCalf('${calf.id}')">Wean</button>
              </div>`;
            }).join('')}
          </div>
        </div>`).join('')}
    </div>
  `;
}
// Record weaning by hand: opens Log event for the calf with Weaning ticked, ready for the weaning weight
// (which counts toward the dam's performance). Saving ends the pair.
function weanCalf(id){
  const calf = animalById(id);
  if(!calf) return;
  openEventModal(calf.id);
  setEventTypes(['Weaning']);
  const w = document.querySelector('.modal input[name="weight"]');
  if(w){ w.placeholder = 'Weaning weight, e.g. 560'; setTimeout(()=> w.focus(), 50); }
}

function resizeImageFile(file, maxDim, quality){
  maxDim = maxDim || 640;
  quality = quality || 0.72;
  return new Promise((resolve, reject)=>{
    if(!file || !file.type || !file.type.startsWith('image/')){ reject(new Error('not an image')); return; }
    const reader = new FileReader();
    reader.onload = function(e){
      const img = new Image();
      img.onload = function(){
        let w = img.width, h = img.height;
        if(w > maxDim || h > maxDim){
          if(w >= h){ h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = ()=>reject(new Error('bad image'));
      img.src = e.target.result;
    };
    reader.onerror = ()=>reject(new Error('read failed'));
    reader.readAsDataURL(file);
  });
}
function handlePastureFileChange(evt){
  const file = evt.target.files[0];
  if(!file) return;
  resizeImageFile(file).then(dataUrl=>{
    pastureFormPhoto = dataUrl;
    const block = document.getElementById('pasture-photo-block');
    if(block) block.innerHTML = renderPastureModalPhotoBlock();
  }).catch(()=>{
    toast("Couldn't read that photo — try a JPG or PNG");
  });
}
function removePastureFormPhoto(){
  pastureFormPhoto = null;
  const block = document.getElementById('pasture-photo-block');
  if(block) block.innerHTML = renderPastureModalPhotoBlock();
}
function savePasture(evt, id, editing){
  evt.preventDefault();
  const f = evt.target;
  const name = f.name.value.trim();
  const acres = f.acres.value.trim();
  const notes = f.notes.value.trim();
  const photo = pastureFormPhoto;
  if(!editing && state.pastures.some(p=>p.name.toLowerCase()===name.toLowerCase())){
    toast('A pasture with that name already exists');
    return;
  }
  if(editing){
    const idx = state.pastures.findIndex(p=>p.id===id);
    const oldName = state.pastures[idx].name;
    state.pastures[idx] = { ...state.pastures[idx], name, acres, notes, photo };
    if(oldName !== name){
      state.animals.forEach(a=>{ if((a.pasture||'').trim()===oldName) a.pasture = name; });
    }
  } else {
    state.pastures.push({ id, name, acres, notes, photo });
  }
  saveState();
  closePastureModal();
  render();
  toast(editing? 'Pasture updated' : 'Pasture added');
}
// Deleting a pasture needs a 10-second press-and-hold in its Edit window.
var PASTURE_DELETE_HOLD_MS = 10000;
var pastureHoldRAF = null;
function startPastureDeleteHold(id){
  if(pastureHoldRAF) return;
  const btn = document.getElementById('pasture-delete-hold');
  if(!btn) return;
  btn.classList.add('holding');
  const start = Date.now();
  const step = ()=>{
    const fill = document.getElementById('pasture-delete-fill');
    const label = document.getElementById('pasture-delete-label');
    if(!fill || !label){ cancelPastureDeleteHold(); return; }
    const elapsed = Date.now() - start;
    fill.style.width = Math.min(100, elapsed / PASTURE_DELETE_HOLD_MS * 100) + '%';
    if(elapsed >= PASTURE_DELETE_HOLD_MS){
      pastureHoldRAF = null;
      label.textContent = 'Deleting…';
      deletePasture(id);
      return;
    }
    label.textContent = `Keep holding… ${Math.ceil((PASTURE_DELETE_HOLD_MS - elapsed)/1000)}s`;
    pastureHoldRAF = requestAnimationFrame(step);
  };
  pastureHoldRAF = requestAnimationFrame(step);
}
function cancelPastureDeleteHold(){
  if(pastureHoldRAF) cancelAnimationFrame(pastureHoldRAF);
  pastureHoldRAF = null;
  const btn = document.getElementById('pasture-delete-hold');
  const fill = document.getElementById('pasture-delete-fill');
  const label = document.getElementById('pasture-delete-label');
  if(btn) btn.classList.remove('holding');
  if(fill) fill.style.width = '0%';
  if(label) label.textContent = 'Press and hold 10s to delete this pasture';
}
function movePastureGroup(id){
  const p = state.pastures.find(x=>x.id===id);
  if(!p) return;
  const animals = state.animals.filter(a=>isActive(a) && (a.pasture||'').trim()===p.name);
  if(animals.length===0){ toast('No animals in this pasture'); return; }
  openMoveModal(`Moving ${animals.length} animal${animals.length===1?'':'s'} currently in "${p.name}".`, animals.map(a=>a.id));
}
function deletePasture(id){
  const p = state.pastures.find(x=>x.id===id);
  if(!p) return;
  state.animals.forEach(a=>{ if((a.pasture||'').trim()===p.name) a.pasture=''; });
  state.pastures = state.pastures.filter(x=>x.id!==id);
  saveState();
  closePastureModal();
  render();
  toast('Pasture deleted');
}

var moveModalIds = [], moveModalTitle = '', moveBack = null;
function moveGoBack(){ if(moveBack) moveBack(); else openMoveModal(moveModalTitle, moveModalIds); }

}
function nextGroupMove(){
  const from = document.getElementById('group-move-from').value;
  const to = document.getElementById('group-move-to').value;
  if(!from){ toast('Choose the pasture to move from'); return; }
  if(!to){ toast('Choose the pasture to move to'); return; }
  if(from===to){ toast('From and To are the same pasture'); return; }
  const animals = from==='__none__' ? unassignedAnimals() : state.animals.filter(a=>isActive(a) && (a.pasture||'').trim()===from);
  if(!animals.length){ toast('No animals in that pasture'); return; }
  moveModalIds = animals.map(a=>a.id);
  moveModalTitle = '';
  moveBack = ()=> openGroupMoveModal(from, to);

function openMoveModal(title, animalIds){

function confirmMove(){

function confirmUnassignMove(){ openMoveReview(''); }
/* Every group move is reviewed first. If the destination already holds other animals,
   the groups would mix, so the pasture's name must be typed before Move unlocks. */
function openMoveReview(dest){
  const moving = moveModalIds.map(animalById).filter(Boolean);
  const movingIds = new Set(moving.map(a=>a.id));
  const fromNames = [...new Set(moving.map(a=>(a.pasture||'').trim() || 'No pasture'))];
  const fromLabel = fromNames.length===1 ? fromNames[0] : `${fromNames.length} pastures`;
  const already = dest ? state.animals.filter(a=>isActive(a) && (a.pasture||'').trim()===dest && !movingIds.has(a.id)) : [];
  const n = moving.length, head = `${n} head`;
  const toLabel = dest || 'No pasture (unassigned)';
  const body = `
    <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap; background:var(--surface-2); padding:14px 16px; border-radius:var(--radius); margin-bottom:14px;">
      <div style="flex:1; min-width:120px;"><div class="hint" style="margin:0;">From</div><div style="font-weight:700;">${escapeHtml(fromLabel)}</div></div>
      <div style="font-size:22px; color:var(--rust);">→</div>
      <div style="flex:1; min-width:120px;"><div class="hint" style="margin:0;">To</div><div style="font-weight:700;">${escapeHtml(toLabel)}</div></div>
      <div style="width:100%; font-size:13px;">Moving <b>${head}</b>.</div>
    </div>
    ${already.length ? `<div style="border:1px solid var(--danger); background:rgba(165,48,30,0.07); border-radius:var(--radius); padding:12px 14px; margin-bottom:14px;">
        <div style="font-weight:700; color:var(--danger); margin-bottom:4px;">⚠ ${escapeHtml(dest)} already has ${already.length} other head</div>
        <p class="hint" style="margin:0 0 10px;">These ${head} will be mixed in with them. To confirm, type the pasture name <b>${escapeHtml(dest)}</b>:</p>
        <input type="text" id="move-confirm-input" autocomplete="off" placeholder="${escapeHtml(dest)}" style="width:100%;" oninput="document.getElementById('move-go-btn').disabled = this.value.trim().toLowerCase() !== ${escapeHtml(JSON.stringify(dest.toLowerCase()))};">
      </div>` : ''}
    <p class="hint" style="margin:0 0 4px;">You can undo this move afterwards from the message that appears, or from <b>Settings ⚙ → Pastures → Recent moves</b>.</p>
    <div class="modal-actions">
      <button type="button" class="btn ghost" onclick="moveGoBack()">← Back</button>
      <div style="flex:1;"></div>
      <button type="button" class="btn rust" id="move-go-btn" ${already.length ? 'disabled' : ''} onclick="performMove(${escapeHtml(JSON.stringify(dest))})">${dest ? `Move ${head}` : `Unassign ${head}`}</button>
    </div>`;
  document.getElementById('modal-root').innerHTML = modalShell(dest ? 'Confirm move' : 'Confirm unassign', body);
  const box = document.getElementById('move-confirm-input');
  if(box) setTimeout(()=>box.focus(), 0);
}
function performMove(dest){
  const record = recordMove(dest, moveModalIds);
  moveModalIds.forEach(id=>{ const a=animalById(id); if(a) a.pasture = dest; });
  const count = moveModalIds.length;
  selectedAnimalIds.clear();
  saveState();
  closeModal();
  render();
  const msg = dest ? `Moved ${count} animal${count===1?'':'s'} to ${dest}` : `Removed pasture for ${count} animal${count===1?'':'s'}`;
  toastAction(msg, 'Undo', ()=>undoMove(record.id), 12000);
}
/* Recent moves are kept on this device (last 10) so a wrong move can be put back. */
var MOVE_HISTORY_KEY = 'herd-move-history';
function loadMoves(){ try{ return JSON.parse(localStorage.getItem(MOVE_HISTORY_KEY) || '[]') || []; }catch(e){ return []; } }
function saveMoves(list){ try{ localStorage.setItem(MOVE_HISTORY_KEY, JSON.stringify(list.slice(0, 10))); }catch(e){} }
function recordMove(dest, ids){
  const items = ids.map(id=>{ const a = animalById(id); return a ? { id, from:(a.pasture||'').trim() } : null; }).filter(Boolean);
  const fromNames = [...new Set(items.map(i=> i.from || 'No pasture'))];
  const m = { id:uid(), at:new Date().toISOString(), to:dest, items, fromLabel: fromNames.length===1 ? fromNames[0] : `${fromNames.length} pastures` };
  saveMoves([m, ...loadMoves()]);
  return m;
}
// Put moved animals back, but only those still where this move left them (a later move wins).
function undoMove(moveId){
  const list = loadMoves();
  const m = list.find(x=>x.id===moveId);
  if(!m){ toast('That move was already undone'); return; }
  document.querySelectorAll('.toast-action').forEach(el=>el.remove());
  let restored = 0, skipped = 0;
  m.items.forEach(it=>{
    const a = animalById(it.id);
    if(a && (a.pasture||'').trim()===m.to){ a.pasture = it.from; restored++; } else skipped++;
  });
  saveMoves(list.filter(x=>x.id!==moveId));
  saveState();
  render();
  toast(`Undone — ${restored} animal${restored===1?'':'s'} back in ${m.fromLabel}` + (skipped ? ` (${skipped} had moved since and were left alone)` : ''));
}
function recentMovesHtml(){
  const weekAgo = Date.now() - 7*86400000;
  const moves = loadMoves().filter(m=> Date.parse(m.at) > weekAgo).slice(0, 5);
  return `<div id="recent-moves" style="margin-top:18px; padding-top:14px; border-top:1px dashed var(--line);">
    <label style="margin-bottom:4px;">Recent moves</label>
    <p class="hint" style="margin:0 0 6px;">Group moves made on this device in the last week. Undo puts the animals back, except any moved again since.</p>
    ${moves.length ? '' : '<p class="hint" style="margin:0;">No moves yet.</p>'}
    <div class="task-list">
      ${moves.map(m=>`<div class="task-item">
        <div class="task-body">
          <div class="task-title">${m.items.length} head · ${escapeHtml(m.fromLabel)} → ${escapeHtml(m.to || 'No pasture')}</div>
          <div class="task-sub">${escapeHtml(new Date(m.at).toLocaleString([], { month:'short', day:'numeric', hour:'numeric', minute:'2-digit' }))}</div>
        </div>
        <button type="button" class="btn ghost sm" onclick="undoMove('${m.id}')">Undo</button>
      </div>`).join('')}
    </div>
  </div>`;
}

/* Events logged for a group together show as one row. New group events share a groupId;
   older records without one are grouped when type, date, details and notes all match. */
function eventGroupKey(ev){
  if(ev.general) return 'x:' + ev.id;
  if(ev.groupId) return 'g:' + ev.groupId;
  if(ev.individual) return 'i:' + ev.id;
  return 'l:' + [ev.type, ev.date, ev.vaccine||'', ev.treatment||'', ev.pregResult||'', ev.notes||'', ev.nextDue||''].join('|');
}
function groupEvents(events){
  const map = new Map();
  events.forEach(ev=>{
    const k = eventGroupKey(ev);
    if(!map.has(k)) map.set(k, { key:k, events:[] });
    map.get(k).events.push(ev);
  });
  return [...map.values()].map(g=>{
    const first = g.events[0];
    return Object.assign(g, { first, isGroup: g.events.length > 1 || !!first.groupId });
  });
}
function eventGroupLabel(g){
  if(g.first.groupLabel) return g.first.groupLabel;
  const names = [...new Set(g.events.map(ev=> ((animalById(ev.animalId)||{}).pasture||'').trim()))];
  if(names.length===1) return names[0] || 'No pasture';
  return `${names.length} pastures`;
}
function openGeneralEvent(id){
  const ev = state.events.find(e=>e.id===id);
  if(!ev) return;
  const days = daysBetween(todayStr(), ev.date);
  const when = days>0 ? `in ${days} day${days===1?'':'s'}` : days===0 ? 'today' : `${-days} day${days===-1?'':'s'} ago`;
  const body = `
    <p class="hint" style="margin:0 0 10px; font-size:12.5px;">General event · ${fmtDate(ev.date)} · ${when}</p>
    ${ev.notes ? `<p style="margin:0 0 14px; font-size:13px; background:var(--surface-2); padding:8px 10px; border-radius:var(--radius); white-space:pre-wrap;">${escapeHtml(ev.notes)}</p>` : ''}
    <p class="hint" style="margin:0;">Not tied to any animal.</p>
    <div class="modal-actions">
      <button type="button" class="btn danger" style="margin-right:auto;" onclick="deleteGeneralEvent('${ev.id}')">Delete</button>
      <button type="button" class="btn rust" onclick="closeModal()">Done</button>
    </div>`;
  document.getElementById('modal-root').innerHTML = modalShell(escapeHtml(ev.title || 'Event'), body);
}
function deleteGeneralEvent(id){
  const ev = state.events.find(e=>e.id===id);
  if(!ev || !confirm(`Delete "${ev.title || 'this event'}"?`)) return;
  state.events = state.events.filter(e=>e.id!==id);
  saveState();
  closeModal();
  render();
  toast('Event deleted');
}
function eventDetail(ev){ return ev.vaccine || ev.treatment || ev.pregResult || ev.detail || ''; }
var eventGroupCache = [];
function openEventGroup(idx){

function deleteEventGroup(idx){

  if(!g) return;
  if(!confirm(`Delete this ${g.first.type} record for all ${g.events.length} animals?`)) return;
  const ids = new Set(g.events.map(ev=>ev.id));

/* ---------- Dam performance (from her calves' weights) ----------
   Birth weight: see birthWeightOf. Weaning weight: the weight recorded closest to
   the weaning date (within 30 days). Gain: (weaning − birth) ÷ days between them. */
/* Birth weight: entered on the animal (or at calving), else the 90 lb default. Entered birth weights must be 40–150 lb. */
var BW_MIN = 40, BW_MAX = 150, BW_DEFAULT = 90;
function parseBirthWeight(v){
  if(v===undefined || v===null || String(v).trim()==='') return { value:'', ok:true };
  const n = Number(String(v).replace(/[^0-9.]/g,''));
  if(!(n >= BW_MIN && n <= BW_MAX)) return { value:'', ok:false };
  return { value: Math.round(n*10)/10, ok:true };
}
function birthWeightOf(a){
  if(!a) return null;
  const set = Number(a.birthWeight);
  if(set >= BW_MIN && set <= BW_MAX) return { lbs:set, date:a.dob||'', recorded:true };
  return { lbs:BW_DEFAULT, date:a.dob||'', recorded:false };
}
// Birth weights entered before Oct 2026 were reset to the 90 lb default. Those carry no birthWeightAt
// stamp; every birth weight entered since is stamped, so this only ever clears the old ones.
function resetOldBirthWeights(){
  let n = 0;
  state.animals.forEach(a=>{
    if(a.birthWeight !== undefined && a.birthWeight !== '' && a.birthWeight !== null && !a.birthWeightAt){ delete a.birthWeight; n++; }
  });
  return n;
}
function calfWeightFacts(c){
  const ws = (c.weights||[]).filter(w=> w && w.date && Number(w.lbs) > 0).slice().sort((x,y)=> x.date<y.date?-1:1);
  const latest = ws.length ? ws[ws.length-1] : null;
  let birth = null, wean = null;
  const bw = birthWeightOf(c);
  if(bw && (bw.recorded || c.dob)) birth = { lbs:bw.lbs, date:bw.date || c.dob, estimated:!bw.recorded };
  if(c.weanDate && ws.length){
    const near = ws.map(w=>({ w, d: Math.abs(daysBetween(c.weanDate, w.date)) })).filter(x=> x.d<=30).sort((x,y)=> x.d-y.d)[0];
    wean = near ? near.w : null;
  }
  let adg = null;
  if(birth && wean && wean.date > birth.date) adg = (Number(wean.lbs) - Number(birth.lbs)) / daysBetween(birth.date, wean.date);
  return { birth, wean, latest, adg };
}
function offspringOf(dam){ return dam && dam.tagId ? state.animals.filter(c=> c.damId===dam.tagId) : []; }
function avgOf(list){ const v = list.filter(x=> x!==null && x!==undefined && !isNaN(x)); return v.length ? v.reduce((a,b)=>a+b,0)/v.length : null; }
function damPerformance(dam){
  const calves = offspringOf(dam);
  const facts = calves.map(c=>({ c, f: calfWeightFacts(c) }));
  return {
    calves: calves.length,
    avgBirth: avgOf(facts.map(x=> x.f.birth && !x.f.birth.estimated ? Number(x.f.birth.lbs) : null)),
    avgWean: avgOf(facts.map(x=> x.f.wean ? Number(x.f.wean.lbs) : null)),
    weanedWeighed: facts.filter(x=> x.f.wean).length,
    avgAdg: avgOf(facts.map(x=> x.f.adg)),
    facts,
  };
}
function lbs(n){ return n===null || n===undefined ? '—' : Math.round(n).toLocaleString() + ' lb'; }
function damPerformanceHtml(){
  const rows = state.animals.filter(a=> !isCalfClass(a) && offspringOf(a).length)
    .map(dam=>({ dam, p: damPerformance(dam) })).filter(r=> r.p.avgWean!==null);
  if(!rows.length) return `<div class="panel" style="margin-top:20px;"><h2>Dam performance</h2>
    <p class="sub">Ranks each cow by her calves' weaning weights. Record a calf's weight when you wean it (Log event → Weaning, with a weight) and her results show here.</p></div>`;
  const herdAvg = avgOf(rows.flatMap(r=> r.p.facts.map(x=> x.f.wean ? Number(x.f.wean.lbs) : null)));
  rows.sort((x,y)=> y.p.avgWean - x.p.avgWean);
  return `<div class="panel" style="margin-top:20px; padding:16px 22px 10px;">
    <h2>Dam performance</h2>
    <p class="sub">Each cow's calves: average weaning weight (the weight logged closest to weaning), compared with the herd average of <b>${lbs(herdAvg)}</b>. Click a cow to see each calf.</p>
    <table class="ledger">
      <thead><tr><th>#</th><th>Dam</th><th>Calves</th><th>Avg weaning wt</th><th>vs herd</th><th>Avg gain</th><th>Avg birth wt</th></tr></thead>
      <tbody>
        ${rows.map((r, i)=>{
          const diff = r.p.avgWean - herdAvg;
          const col = diff >= 0 ? 'var(--pasture-dark)' : 'var(--danger)';
          return `<tr onclick="openDrawer('${r.dam.id}')">
            <td class="num-cell">${i+1}</td>
            <td>${eartag(r.dam)}</td>
            <td class="num-cell">${r.p.calves}${r.p.weanedWeighed < r.p.calves ? ` <span class="muted" style="font-size:11px;">(${r.p.weanedWeighed} weighed)</span>` : ''}</td>
            <td class="num-cell"><b>${lbs(r.p.avgWean)}</b></td>
            <td class="num-cell" style="color:${col}; font-weight:700;">${diff >= 0 ? '+' : '−'}${Math.abs(Math.round(diff)).toLocaleString()} lb</td>
            <td class="num-cell">${r.p.avgAdg===null ? '—' : r.p.avgAdg.toFixed(2) + ' lb/day'}</td>
            <td class="num-cell">${lbs(r.p.avgBirth)}</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
  </div>`;
}
function viewBreeding(){
  const records = [...state.breeding].sort((a,b)=> a.breedingDate<b.breedingDate?1:-1);
  return `

/* ---------- Change log (audit) ----------
   Every add, change, delete and restore, newest first, from every computer sharing the herd.

var auditView = { q:'', limit:50 };
var AUDIT_ACTIONS = { added:'Added', changed:'Changed', deleted:'Deleted', restored:'Restored' };
function auditEntries(){
  const q = auditView.q.trim().toLowerCase();
  const list = (docMeta.log || []).slice().reverse();
  if(!q) return list;
  return list.filter(e=> [AUDIT_ACTIONS[e.action] || e.action, e.what, e.label, e.device, e.by, fmtWhen(e.at)].join(' ').toLowerCase().includes(q));
}
function auditLogHtml(){
  return `<div class="field" style="${BOX}">
    <label style="margin-bottom:6px;">Change log</label>
    <p class="hint" style="margin:0 0 8px;">Every record added, changed or deleted, and every restore, with when, which computer and which Google account. Newest first. Every computer that shares this herd shows the same log.</p>
    <div style="display:flex; gap:8px; margin-bottom:8px; flex-wrap:wrap;">
      <input type="text" id="audit-search" style="flex:1; min-width:180px;" placeholder="Search: animal, change, computer, person…" value="${escapeHtml(auditView.q)}" oninput="auditSearch(this.value)">
      <button type="button" class="btn ghost sm" onclick="downloadAuditCsv()">⬇ Download log (CSV)</button>
    </div>
    <div id="audit-list">${auditListHtml()}</div>
  </div>`;
}
function auditListHtml(){
  const all = auditEntries();
  if(!all.length) return `<p class="hint" style="margin:0;">${auditView.q ? 'Nothing in the log matches that search.' : 'No changes logged yet.'}</p>`;
  const rows = all.slice(0, auditView.limit).map(e=> `<div class="audit-row">
      <span class="audit-act ${escapeHtml(e.action)}">${escapeHtml(AUDIT_ACTIONS[e.action] || e.action)}</span>
      <span class="audit-main"><b>${escapeHtml(e.label || '')}</b>${e.what && e.action!=='restored' ? ` <span class="hint">${escapeHtml(e.what)}</span>` : ''}
        <span class="audit-meta">${escapeHtml(fmtWhen(e.at))} · ${escapeHtml(e.device || 'Unknown computer')}${e.by ? ' · ' + escapeHtml(e.by) : ''}</span></span>
    </div>`).join('');
  const more = all.length > auditView.limit
    ? `<button type="button" class="btn ghost sm" style="margin-top:8px;" onclick="auditView.limit += 100; refreshAuditList();">Show more (${all.length - auditView.limit} older)</button>` : '';

// Run a Drive step for the panel, showing "Loading…" and a plain message if it fails.

function driveErrorText(e){
  const c = e && e.code;
  if(c==='offline' || isOffline()) return "No internet right now. Try again when you're back online.";
  if(c==='auth' || c==='signin' || c==='popup' || c==='scope') return "Google sign-in didn't finish. Tap Connect and allow access to Google Drive.";
  if(c==='notfound' || c==='forbidden') return "That Google Drive item can't be opened. It may have been moved, deleted or unshared.";
  if(c==='bad-file') return "That backup file couldn't be read.";
  return "Google Drive didn't answer just now. Try again in a moment.";
}

// A new computer finds its backup folder by itself: one backup → use it, several → choose, none → pick a folder.
async function findBackups(auto){
  driveUi.view = 'found'; driveUi.busy = true; refreshDrivePanel();
  const files = await driveList(`${tagQuery('main')} and trashed=false`);
  const found = [];
  for(const f of files){
    const parent = (f.parents||[])[0];
    let trail = [];
    try{ trail = parent ? await folderTrail(parent) : []; }catch(e){}
    const p = f.appProperties || {};
    found.push({ folderId: parent, trail, path: trailText(trail) || 'Google Drive', name: f.name, savedAt: fileSavedAt(f), device: p.device || '' });
  }
  found.sort((a, b)=> String(b.savedAt).localeCompare(String(a.savedAt)));
  driveUi.busy = false; driveUi.found = found;
  if(found.length===1 && (auto || found[0].folderId===drive.folderId)) return useFoundBackup(0);
  if(!found.length){
    if(auto || !drive.folderId){
      await browseFolder(null);
      driveUi.msg = "No Range Book backup in your Google Drive yet. Choose the folder to keep the backups in (or make a new one).";
      refreshDrivePanel();
      return;
    }
    driveUi.view = ''; driveUi.msg = 'No Range Book backup found in your Google Drive.';
  }
  refreshDrivePanel();
}

/* A deliberate restore replaces all records. replacedAt = now, so the other computers take the restored
   version instead of merging the old records back in. The change log is kept and the backup's added to it. */
async function restoreDoc(incoming, label){
  if(saveTimer) await flushSave(); else stampChanges();
  const now = nowIso();
  const cur = buildDoc();
  if(driveSetUp() && !isOffline()){
    // Keep what was here as a copy in the folder first, in case the restore was a mistake.
    try{
      const { bytes, mime } = await backupBytes(cur);
      const stamp = localDay() + ' ' + new Date().toTimeString().slice(0, 5).replace(':', '.');
      await driveUpload('', { name: `Range Book backup - ${backupName()} - before restore ${stamp}.json.gz`, mimeType: mime, parents: [drive.folderId],
        appProperties: { rangebook:'copy', savedAt: cur.savedAt, device: DEVICE_NAME, name: backupName() } }, bytes, mime);
    }catch(e){}
  }
  const next = fillDoc(JSON.parse(JSON.stringify(incoming)));
  ALL_COLS.forEach(col=>{
    const keep = new Set(next[col].map(r=> colKey(col, r)));
    (cur[col]||[]).forEach(r=>{ const k = colKey(col, r); if(k && !keep.has(k)) next.tombs[col][k] = now; });
    // The restored version of each record is the newest one now, so it wins on every computer.
    next[col].forEach(r=>{ const k = colKey(col, r); if(!k) return; if(RECORD_COLS.includes(col)) r.updated = now; else next.stamps[col][k] = now; delete next.tombs[col][k]; });
  });
  next.log = mergeLogs(cur.log, next.log);
  next.log.push({ id: uid(), at: now, device: DEVICE_NAME, by: drive.account || '', action:'restored', col:'', key:'', what:'backup', label: 'Restored ' + label });
  next.savedAt = now; next.replacedAt = now;
  applyDoc(next);
  try{ await writeLocalDoc(); localSaveFailed = false; }catch(e){ localSaveFailed = true; }
  render(); refreshBadge();
  if(driveSetUp()) await syncNow('restore', { force:true });
}

function handleBackupFile(evt){

      </div>

async function applyImport(mode){
  if(!pendingImport) return;
  if(mode==='replace'){
    const btn = document.getElementById('import-replace-btn');
    if(btn && !btn.dataset.armed){
      btn.dataset.armed = '1';
      const when = pendingImport.savedAt && pendingImport.savedAt!==OLD_STAMP ? ' saved ' + fmtWhen(pendingImport.savedAt) : '';
      btn.textContent = `Replace all records with the backup${when}? Tap again`;
      btn.classList.remove('ghost'); btn.classList.add('danger'); btn.style.color = '';
      return;
    }
    const incoming = pendingImport; pendingImport = null;
    await restoreDoc(incoming, 'a backup file');
  } else {
    const incoming = pendingImport; pendingImport = null;
    if(saveTimer) await flushSave(); else stampChanges();
    const r = mergeDocs(buildDoc(), incoming);
    applyDoc(r.doc);
    docMeta.savedAt = nowIso();
    logChange('added', 'animals', 'import:' + docMeta.savedAt, 'Added records from a backup file', docMeta.savedAt);
    try{ await writeLocalDoc(); localSaveFailed = false; }catch(e){ localSaveFailed = true; }
    render();
    confirmOnDrive('Backup');
  }
  const summary = herdCounts(normalizeState(state));
  const countsEl = document.getElementById('backup-counts');
  if(countsEl) countsEl.textContent = summary;
  const box = document.getElementById('backup-preview');
  if(box) box.innerHTML = `<p class="hint" style="color:var(--pasture-dark); margin:10px 0 0;"><b>Done.</b> This herd now has ${summary}.${driveSetUp() ? ' Backing up to Google Drive…' : ''}</p>`;
  refreshBadge();
  toast(mode==='replace' ? 'All records replaced from the backup' : 'Backup added to the herd');
}

var resetHoldStart = null;
var resetHoldRAF = null;
var RESET_HOLD_MS = 10000;
function startResetHold(evt){
  if(evt && evt.preventDefault) evt.preventDefault();
  if(resetHoldRAF) return;
  const btn = document.getElementById('reset-hold-btn');
  if(!btn) return;
  btn.classList.add('holding');
  resetHoldStart = Date.now();
  const step = ()=>{
    const fill = document.getElementById('reset-hold-fill');
    const label = document.getElementById('reset-hold-label');
    if(!fill || !label){ cancelResetHold(); return; }
    const elapsed = Date.now() - resetHoldStart;
    const pct = Math.min(100, (elapsed / RESET_HOLD_MS) * 100);
    fill.style.width = pct + '%';
    if(pct >= 100){
      label.textContent = 'Resetting…';
      performReset();
      return;
    }
    const secsLeft = Math.ceil((RESET_HOLD_MS - elapsed) / 1000);
    label.textContent = `Keep holding… ${secsLeft}s`;
    resetHoldRAF = requestAnimationFrame(step);
  };
  resetHoldRAF = requestAnimationFrame(step);
}
function cancelResetHold(){
  if(resetHoldRAF) cancelAnimationFrame(resetHoldRAF);
  resetHoldRAF = null;
  resetHoldStart = null;
  const btn = document.getElementById('reset-hold-btn');
  const fill = document.getElementById('reset-hold-fill');
  const label = document.getElementById('reset-hold-label');
  if(btn) btn.classList.remove('holding');
  if(fill) fill.style.width = '0%';
  if(label) label.textContent = 'Press and hold 10s to reset all data';
}
function performReset(){
  if(resetHoldRAF) cancelAnimationFrame(resetHoldRAF);
  resetHoldRAF = null;
  resetHoldStart = null;
  state.animals = [];
  state.events = [];
  state.breeding = [];
  state.pastures = [];
  state.breeds = [];
  state.vaccines = [];
  selectedAnimalIds.clear();
  // A reset replaces everything on purpose, so the other computers take the empty herd too.
  docMeta.replacedAt = nowIso();
  saveState();
  closeModal();
  currentTab = 'dashboard';
  render();
  toast('All data has been reset');
}

  const bwIn = parseBirthWeight(f.birthWeight ? f.birthWeight.value : '');
  if(!bwIn.ok){ toast(`Birth weight must be between ${BW_MIN} and ${BW_MAX} lb`); if(f.birthWeight) f.birthWeight.focus(); return; }
  // When editing, status, pasture and sale price are kept as they are (they change through Log event).
  const existing = editing ? (animalById(id) || {}) : {};
  const rec = {
    id,
    tagId: f.tagId.value.trim(),
    name: f.name.value.trim(),
    klass: f.klass.value,
    breed: f.breed.value.trim(),
    dob: f.dob.value,
    yearLetter: f.yearLetter.value.trim().toUpperCase() || letterForDate(f.dob.value),
    status: editing ? (existing.status || 'active') : f.status.value,
    damId: f.damId.value.trim(),
    sireId: sireRefFromInput(f.sireId.value),
    pasture: editing ? (existing.pasture || '') : f.pasture.value.trim(),
    notes: f.notes.value.trim(),
    salePrice: editing ? (existing.salePrice ?? '') : (f.status.value==='sold' && f.salePrice.value ? Number(f.salePrice.value) : ''),
    photo: animalFormPhoto,
  };
  // Breeding soundness only applies to bulls.
  const isBull = rec.klass==='Bull';
  rec.scrotalCm = isBull && f.scrotalCm.value!=='' ? Number(f.scrotalCm.value) : '';
  rec.semenCheck = isBull ? f.semenCheck.value : '';
  rec.semenCheckDate = isBull ? f.semenCheckDate.value : '';
  rec.purchasePrice = isBull && f.purchasePrice.value!=='' ? Number(f.purchasePrice.value) : '';
  rec.purchasedFrom = isBull ? f.purchasedFrom.value.trim() : '';
  rec.purchaseDate = isBull ? f.purchaseDate.value : '';
  if(bwIn.value === '') delete rec.birthWeightAt;
  else if(rec.birthWeight !== bwIn.value || !rec.birthWeightAt) rec.birthWeightAt = new Date().toISOString();
  rec.birthWeight = bwIn.value;
  ensurePastureExists(rec.pasture);
  ensureBreedExists(rec.breed);
  if(editing){
    const idx = state.animals.findIndex(a=>a.id===id);
    state.animals[idx] = { ...state.animals[idx], ...rec };
  } else {
    rec.weights = [];
    rec.weanDate = null;
    state.animals.push(rec);
    rememberLastAdded(rec);
  }
  saveState();
  closeModal();
  render();
  toast(editing? 'Animal updated' : 'Animal added');
}
function deleteAnimal(id){
  if(!confirm('Delete this animal and its records? This cannot be undone.')) return;
  state.animals = state.animals.filter(a=>a.id!==id);
  state.events = state.events.filter(e=>e.animalId!==id);
  saveState();
  closeModal();
  closeDrawer();
  render();
  toast('Animal deleted');
}

var importRows = [];

function normalizeHeader(h){ return String(h||'').trim().toLowerCase().replace(/[^a-z0-9]/g,''); }
// Dam / Sire columns come with many headings ("Dam RFID", "Dam's Tag", "Mother ID", "Sire Name"…),
// but not "Dam Breed" and the like.
var PARENT_SUFFIX = '(tag|id|rfid|eid|no|num|number|name|visual|vid|tagid|tagno|tagnum|tagnumber|visualid|eartag|eartagno|rfidtag|eidtag)?';
var DAM_HEADER = new RegExp('^(dam|mother|mom|mum)s?' + PARENT_SUFFIX + '$');
var SIRE_HEADER = new RegExp('^(sire|father)s?' + PARENT_SUFFIX + '$');
// Visual / management / dangle tag columns ("Visual Tag", "VID", "Tag Visual", "Dangle Tag"…).
var VISUAL_HEADER = /^(visual|vid$|vtag|dangle|panel|management|mgmt|tagvisual)/;
// Which Rangebook field a spreadsheet column fills. A "Cow" / "Cow ID" / "Cow Tag" column next to a real
// RFID column is the mother (as on heifer and calf sheets), not the animal's own ID.
function importFieldFor(header, allHeaders){
  const n = normalizeHeader(header);
  if(DAM_HEADER.test(n)) return 'damId';
  if(SIRE_HEADER.test(n)) return 'sireId';
  const isIdCol = o=>{ const on = normalizeHeader(o); return IMPORT_HEADER_MAP[on]==='tagId' && !/^cow/.test(on) && !VISUAL_HEADER.test(on); };
  // A visual tag column is the visual tag when the sheet has another ID column, otherwise it's the ID.
  if(VISUAL_HEADER.test(n)) return (allHeaders||[]).some(o=> o!==header && isIdCol(o)) ? 'visualTag' : 'tagId';
  const key = IMPORT_HEADER_MAP[n];
  if(key==='tagId'){
    const idCols = (allHeaders||[]).filter(o=> IMPORT_HEADER_MAP[normalizeHeader(o)]==='tagId');
    if(idCols.length > 1){
      // "Cow" / "Cow ID" / "Cow Tag" next to the animal's own ID column is the mother.
      if(/^cow/.test(n) && idCols.some(o=> !/^cow/.test(normalizeHeader(o)))) return 'damId';
      // Of several ID columns the first stays the RFID (as it always has, so re-imports match the same
      // animals); the others (Tag #, Visual ID, VID…) are kept as the visual tag instead of being dropped.
      const own = idCols.filter(o=> !/^cow/.test(normalizeHeader(o)));
      const primary = own[0];
      if(header !== primary) return 'visualTag';
    }
  }
  return key;
}

function normalizeClass(v){
  const s = String(v||'').trim().toLowerCase();
  if(!s) return 'Cow';
  if(s.includes('steer') && s.includes('calf')) return 'Steer Calf';
  if(s.includes('bull') && s.includes('calf')) return 'Bull Calf';
  if(s.includes('heifer') && s.includes('calf')) return 'Heifer Calf';
  if(s.includes('steer')) return 'Steer';
  // "Bred heifer", "Open heifer", "Replacement heifer", "1st calf heifer"… are all heifers.
  if(s.includes('heifer') || s==='h' || s==='hfr') return 'Heifer';
  if(s.startsWith('cow')) return 'Cow';
  if(s.includes('bull') || s==='b' || s==='m' || s==='male') return 'Bull';
  if(s.includes('calf')) return 'Heifer Calf';
  if(s==='f'||s==='female') return 'Cow';
  return 'Cow';
}
function normalizeSemenCheck(v){
  const s = String(v||'').trim().toLowerCase();
  if(!s) return '';
  if(/^(p|pass|passed|sat|satisfactory|yes|y|ok|good)\b/.test(s)) return 'Passed';
  if(/^(f|fail|failed|unsat|unsatisfactory|no|n|bad)\b/.test(s)) return 'Failed';
  return '';
}
function normalizeStatus(v){
  const s = String(v||'').trim().toLowerCase();
  if(s.startsWith('sold')) return 'sold';
  if(/preg|^bred/.test(s)) return 'active-preg';
  if(s.startsWith('dead') || s.startsWith('decease')) return 'deceased';
  return 'active';
}
function parseDateFlexible(v){
  if(!v && v!==0) return '';
  if(v instanceof Date && !isNaN(v)) return v.toISOString().slice(0,10);
  const s = String(v).trim();
  if(!s) return '';
  if(/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10);
  const d = new Date(s);
  if(!isNaN(d)) return d.toISOString().slice(0,10);
  return '';
}

function handleImportFile(evt){
  const file = evt.target.files[0];
  const previewEl = document.getElementById('import-preview');
  if(!file) return;
  if(typeof XLSX === 'undefined'){
    previewEl.innerHTML = `<p class="hint" style="color:var(--danger);">The spreadsheet reader didn't load — check your connection and try again.</p>`;
    return;
  }
  previewEl.innerHTML = `<p class="hint">Reading ${escapeHtml(file.name)}…</p>`;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, { type:'array', cellDates:true });
      importSheets = wb.SheetNames.map(name=>readImportSheet(name, wb.Sheets[name]));
      if(!importSheets.some(sh=>sh.rows.length)){
        const empty = importSheets.filter(sh=>!sh.headerFound).map(sh=>escapeHtml(sh.name)).join(', ');
        previewEl.innerHTML = `<p class="hint" style="color:var(--danger);">Couldn't find an <b>RFID</b> column${empty? ' in '+empty : ''}. The sheet needs a header row with a column like "RFID", "EID", "Tag ID" or "Animal ID".</p>`;
        return;
      }
      processImportRows(importSheets.filter(sh=>sh.include).flatMap(sh=>sh.rows));
    }catch(err){
      previewEl.innerHTML = `<p class="hint" style="color:var(--danger);">Couldn't read that file. Make sure it's a valid .xlsx, .xls, or .csv export.</p>`;
    }
  };
  reader.onerror = function(){
    previewEl.innerHTML = `<p class="hint" style="color:var(--danger);">Couldn't read that file.</p>`;
  };
  reader.readAsArrayBuffer(file);
}

// What to do with spreadsheet rows whose tag is already in the herd: null (not chosen yet), 'skip' or 'overwrite'.
var importDupMode = null;
var importExtraColumns = new Set();
// Every tab is read. In each, the header row is the first of the top 15 rows that has a tag column,
// so title rows above the headers are fine.
var importSheets = [];
function readImportSheet(name, sheet){
  // Keep blank rows so row numbers match what Excel shows.
  const grid = XLSX.utils.sheet_to_json(sheet, { header:1, defval:'', raw:false, blankrows:true });
  // Excel shows long numbers (RFIDs) as "9.82E+14"; use the real number for those cells.
  const rawGrid = XLSX.utils.sheet_to_json(sheet, { header:1, defval:'', raw:true, blankrows:true });
  grid.forEach((row, r)=> row.forEach((cell, c)=>{
    const raw = rawGrid[r] && rawGrid[r][c];
    if(typeof raw==='number' && Number.isInteger(raw) && /e[+-]?\d/i.test(String(cell))) row[c] = String(raw);
  }));
  const firstRow = sheet['!ref'] ? XLSX.utils.decode_range(sheet['!ref']).s.r + 1 : 1;
  const h = grid.slice(0, 15).findIndex(row=> row.some(c=> IMPORT_HEADER_MAP[normalizeHeader(c)]==='tagId'));
  if(h<0) return { name, rows:[], headerFound:false, include:false };
  const headers = grid[h].map(c=>String(c||'').trim());
  const rows = grid.slice(h+1)
    .map((r, i)=>({ r, rowNum: firstRow + h + 1 + i }))
    .filter(({r})=> r.some(c=> String(c).trim()!==''))
    .map(({r, rowNum})=>{
      const o = { __sheet: name, __row: rowNum };
      headers.forEach((hd, j)=>{ if(hd && !(hd in o)) o[hd] = r[j]===undefined ? '' : r[j]; });
      return o;
    });
  return { name, rows, headerFound:true, include: rows.length>0, headers };
}
function toggleImportSheet(i, on){
  if(!importSheets[i]) return;
  importSheets[i].include = on;
  processImportRows(importSheets.filter(sh=>sh.include).flatMap(sh=>sh.rows));
}
function processImportRows(rows){
  const existingTags = new Set(state.animals.map(a=>a.tagId));
  const seenInFile = new Set();
  importDupMode = null;
  importExtraColumns = new Set();
  importRows = rows.map(row=>{
    const rec = {};
    const extras = [];
    const headers = Object.keys(row).filter(h=> !h.startsWith('__'));
    Object.keys(row).forEach(h=>{
      if(h.startsWith('__')) return;
      const key = importFieldFor(h, headers);
      const v = String(row[h]===undefined ? '' : row[h]).trim();
      if(!v) return;
      if(key){ if(!(key in rec)) rec[key] = row[h]; }
      else { extras.push(h + ': ' + v); importExtraColumns.add(h); }
    });
    // Columns Rangebook has no field for (Color, Reg #, …) are kept in Notes instead of being dropped.
    if(extras.length) rec.notes = [String(rec.notes||'').trim(), ...extras].filter(Boolean).join('; ');
    const classText = String(rec.klass||'').toLowerCase();
    if(!rec.status && /\b(bred|preg)/.test(classText)) rec.status = 'Active – Preg';
    const tagId = String(rec.tagId||'').trim();
    let issue = '';
    if(!tagId) issue = 'Missing RFID';
    else if(seenInFile.has(tagId)) issue = 'Duplicate in file';
    if(tagId) seenInFile.add(tagId);
    return {
      sheet: row.__sheet, rowNum: row.__row,
      inHerd: !issue && existingTags.has(tagId),
      provided: Object.keys(rec),
      tagId,
      name: String(rec.name||'').trim(),
      klass: normalizeClass(rec.klass),
      breed: String(rec.breed||'').trim(),
      dob: parseDateFlexible(rec.dob),
      yearLetter: String(rec.yearLetter||'').trim().toUpperCase() || letterForDate(parseDateFlexible(rec.dob)),
      damId: String(rec.damId||'').trim(),
      visualTag: String(rec.visualTag||'').trim(),
      birthWeight: parseBirthWeight(rec.birthWeight).value,
      birthWeightBad: !parseBirthWeight(rec.birthWeight).ok,
      sireId: String(rec.sireId||'').trim(),
      scrotalCm: rec.scrotalCm!==undefined && !isNaN(parseFloat(rec.scrotalCm)) ? parseFloat(rec.scrotalCm) : '',
      semenCheck: normalizeSemenCheck(rec.semenCheck),
      semenCheckDate: parseDateFlexible(rec.semenCheckDate),
      purchasePrice: rec.purchasePrice!==undefined && !isNaN(parseFloat(String(rec.purchasePrice).replace(/[$,]/g,''))) ? parseFloat(String(rec.purchasePrice).replace(/[$,]/g,'')) : '',
      purchasedFrom: String(rec.purchasedFrom||'').trim(),
      purchaseDate: parseDateFlexible(rec.purchaseDate),
      status: normalizeStatus(rec.status),
      pasture: String(rec.pasture||'').trim(),
      notes: String(rec.notes||'').trim(),
      weight: rec.weight,
      issue
    };
  });
  renderImportPreview();
}

          <tbody>
            ${importRows.map(r=>`<tr>

              <td>${escapeHtml(r.name)||'<span class="muted">—</span>'}</td>

              <td>${(st=>`<span class="status-tag" style="${st.bad?'color:var(--danger);':st.warn?'color:var(--tag-dark);':st.muted?'opacity:.6;':''}">${escapeHtml(st.label)}</span>`)(importRowState(r))}</td>

}

// Spreadsheet column -> animal field, for overwriting an existing animal with only the cells that were filled in.
var IMPORT_OVERWRITE_FIELDS = ['name','visualTag','birthWeight','klass','breed','dob','yearLetter','damId','sireId','status','pasture','notes','scrotalCm','semenCheck','semenCheckDate','purchasePrice','purchasedFrom','purchaseDate'];
// Dam/Sire cells may hold a name instead of an RFID; link them to that animal's RFID when the name is unique.
/* Dam / Sire values from a spreadsheet or typed by hand can be an RFID or a name, written a little
   differently from the herd record ("48 H" vs "48H", "102.0", spaces in an RFID). Find the one animal
   they mean; if several share a name, prefer the right sex, then grown animals, then ones in the herd. */
function normRef(v){
  let t = String(v||'').trim().toLowerCase();
  if(/^\d+\.0+$/.test(t)) t = t.replace(/\.0+$/, '');
  t = t.replace(/[\s\-_#]+/g, '');
  // "048" and "48", "048h" and "48h" are the same tag
  return t.replace(/^0+(?=\d)/, '');
}
// Birth year from the year letter, else the date of birth.
function birthYearOf(a){
  const y = yearFromLetter(a && a.yearLetter);
  if(y!==null) return y;
  const m = /^(\d{4})-/.exec(String((a && a.dob) || ''));
  return m ? Number(m[1]) : null;
}
// child: the animal whose Dam / Sire this is. It can never be its own parent, and a parent is older.
// (Calves often carry their mother's tag number, so heifer "1E" and her dam "1E" share a name.)
function resolveParentRef(value, want, child){
  const raw = String(value||'').trim();
  if(!raw) return null;
  const exact = animalByTag(raw);
  if(exact && exact!==child) return exact;
  const key = normRef(raw);
  if(!key) return null;
  const childYear = birthYearOf(child);
  const pick = list=>{
    let l = list.filter(x=> x!==child);
    if(l.length<=1) return l[0] || null;
    const narrow = test=>{ const k = l.filter(test); if(k.length) l = k; };
    narrow(x=> want==='dam' ? ['Cow','Heifer'].includes(x.klass) : x.klass==='Bull');
    if(want==='dam') narrow(x=> x.klass==='Cow');
    narrow(x=> !isCalfClass(x));
    if(childYear!==null) narrow(x=>{ const y = birthYearOf(x); return y!==null && y < childYear; });
    narrow(isActive);
    return l.length===1 ? l[0] : null;
  };
  const byField = f=> pick(state.animals.filter(x=> x[f] && normRef(x[f])===key));
  const found = byField('tagId') || byField('name') || byField('visualTag');
  if(found) return found;
  // Just the tag number ("48") for a cow tagged "48H" or "H48": only when exactly one animal fits.
  if(/^\d+$/.test(key)){
    const re = new RegExp('^(' + key + '[a-z]|[a-z]' + key + ')$');
    return pick(state.animals.filter(x=> re.test(normRef(x.name)) || (x.visualTag && re.test(normRef(x.visualTag)))));
  }
  return null;
}
// Point Dam / Sire at the matching animal's RFID. Only links when exactly one animal matches. Returns how many were linked.
// Earlier imports kept unrecognised columns in Notes as "Heading: value". Move Dam / Sire ones back.
function parentsFromNotes(a){
  if(!a.notes || (a.damId && a.sireId && a.visualTag)) return false;
  let changed = false;
  const kept = String(a.notes).split('; ').filter(seg=>{
    const m = /^([^:]{1,40}):\s*(.+)$/.exec(seg);
    if(!m) return true;
    const n = normalizeHeader(m[1]);
    if(!a.damId && DAM_HEADER.test(n)){ a.damId = m[2].trim(); changed = true; return false; }
    if(!a.sireId && SIRE_HEADER.test(n)){ a.sireId = m[2].trim(); changed = true; return false; }
    if(!a.visualTag && VISUAL_HEADER.test(n)){ a.visualTag = m[2].trim(); changed = true; return false; }
    return true;
  });
  if(changed) a.notes = kept.join('; ');
  return changed;
}
function linkParentRefs(onlyTags){
  let n = 0;
  state.animals.forEach(a=>{
    if(onlyTags && !onlyTags.has(a.tagId)) return;
    if(parentsFromNotes(a)) n++;
    if(a.damId && !animalByTag(a.damId)){ const d = resolveParentRef(a.damId, 'dam', a); if(d && d!==a){ a.damId = d.tagId; n++; } }
    if(a.sireId && !animalByTag(a.sireId)){ const s2 = resolveParentRef(a.sireId, 'sire', a); if(s2 && s2!==a){ a.sireId = s2.tagId; n++; } }
  });
  return n;
}
function linkParentsByName(){ return linkParentRefs(null); }
function confirmImport(){
  const fresh = importRows.filter(r=>!r.issue && !r.inHerd);
  const dups = importRows.filter(r=>!r.issue && r.inHerd);
  if(dups.length && !importDupMode) return;
  const updates = importDupMode==='overwrite' ? dups : [];
  if(fresh.length + updates.length === 0) return;
  updates.forEach(r=>{
    const a = animalByTag(r.tagId);
    if(!a) return;
    IMPORT_OVERWRITE_FIELDS.forEach(k=>{ if(r.provided.includes(k) && !(k==='birthWeight' && r.birthWeightBad)) a[k] = r[k]; });
    if(r.provided.includes('birthWeight') && !r.birthWeightBad) a.birthWeightAt = new Date().toISOString();
    // A new birthday without a year letter column moves the year letter with it.
    if(r.provided.includes('dob') && r.dob && !(r.provided.includes('yearLetter') && String(r.yearLetter||'').trim())) a.yearLetter = letterForDate(r.dob);
    const w = Number(r.weight);
    if(r.provided.includes('weight') && !isNaN(w) && w>0){
      const date = todayStr();
      a.weights = a.weights || [];
      if(!a.weights.some(x=>x.date===date && x.lbs===w)) a.weights.push({ date, lbs: w });
    }
    if(r.pasture) ensurePastureExists(r.pasture);
    if(r.breed) ensureBreedExists(r.breed);
  });
  fresh.forEach(r=>{
    const weights = [];
    if(r.weight){
      const w = Number(r.weight);
      if(!isNaN(w) && w>0) weights.push({ date: todayStr(), lbs: w });
    }
    if(r.pasture) ensurePastureExists(r.pasture);
    if(r.breed) ensureBreedExists(r.breed);
    state.animals.push({
      id: uid(), tagId: r.tagId, name: r.name, klass: r.klass, breed: r.breed, dob: r.dob, yearLetter: r.yearLetter,
      damId: r.damId, sireId: r.sireId, status: r.status, pasture: r.pasture, notes: r.notes,
      ...(r.visualTag ? { visualTag: r.visualTag } : {}),
      ...(r.birthWeight!=='' ? { birthWeight: r.birthWeight, birthWeightAt: new Date().toISOString() } : {}),
      scrotalCm: r.scrotalCm, semenCheck: r.semenCheck, semenCheckDate: r.semenCheckDate,
      purchasePrice: r.purchasePrice, purchasedFrom: r.purchasedFrom, purchaseDate: r.purchaseDate,
      weights, weanDate: null
    });
  });
  linkParentsByName(new Set([...fresh, ...updates].map(r=>r.tagId)));
  saveState();
  confirmOnDrive('Import');
  closeModal();
  currentTab = 'animals';
  render();
  const parts = [];
  if(fresh.length) parts.push(`imported ${fresh.length} new`);
  if(updates.length) parts.push(`updated ${updates.length}`);
  if(dups.length && !updates.length) parts.push(`skipped ${dups.length} already in herd`);
  const msg = parts.join(', ');
  toast(msg.charAt(0).toUpperCase() + msg.slice(1));
  const badBw = [...fresh, ...updates].filter(r=> r.birthWeightBad).length;
  if(badBw) setTimeout(()=> toast(`${badBw} birth weight${badBw===1?' was':'s were'} outside ${BW_MIN}–${BW_MAX} lb and left out`), 1800);
  const tags = new Set([...fresh, ...updates].map(r=>r.tagId));
  const unmatched = state.animals.filter(a=> tags.has(a.tagId) && a.damId && !animalByTag(a.damId));
  if(unmatched.length){
    const eg = [...new Set(unmatched.map(a=>a.damId))].slice(0,3).map(v=>`“${v}”`).join(', ');
    setTimeout(()=> toast(`${unmatched.length} dam${unmatched.length===1?'':'s'} didn't match any animal in the herd (e.g. ${eg}). They show as “Not in herd (…)”.`), 900);
  }
}

function downloadImportTemplate(){
  if(typeof XLSX === 'undefined'){ toast("Spreadsheet tool didn't load — check your connection"); return; }
  // Bull-only columns (Scrotal … Purchase Date) can be left blank for cows, heifers and calves.
  const headers = ['RFID','Name','Class','Breed','DOB','Year Letter','Dam','Sire','Status','Pasture','Weight','Notes',
                   'Scrotal (cm)','Semen Check','Semen Check Date','Purchase Price','Purchased From','Purchase Date'];
  const examples = [
    ['982000123456789','Clover','Cow','Angus','2021-03-14','Y','','Duke','Active','North 40','1250','Easy calver', '','','','','',''],
    ['982000987654321','Duke','Bull','Angus','2022-02-01','Z','','','Active','Bull Pasture','1950','', '38','Passed','2026-04-01','6500','Smith Angus Ranch','2023-03-15'],
  ];
  const ws = XLSX.utils.aoa_to_sheet([headers, ...examples]);
  ws['!cols'] = headers.map(h=>({ wch: Math.max(12, h.length + 2) }));

}

// Castrating: a bull calf becomes a steer calf, a bull becomes a steer. Returns true if the class changed.
function applyCastration(a){
  if(!a) return false;
  if(a.klass==='Bull Calf'){ a.klass = 'Steer Calf'; return true; }
  if(a.klass==='Bull'){ a.klass = 'Steer'; return true; }
  return false;
}
// What logging one event type does to the animal (status, weaning, castration).
function applyEventEffects(a, type, date, treatments, extra){
  if(!a) return false;
  extra = extra || {};
  if(type==='Weaning') applyWeaning(a, date);
  if(type==='Death / Loss') a.status = 'deceased';
  if(type==='Sale'){ a.status = 'sold'; if(extra.salePrice!=='' && extra.salePrice!==undefined) a.salePrice = extra.salePrice; }
  if(type==='Pasture move' && extra.pasture!==undefined) a.pasture = extra.pasture;
  if(type==='Status change' && extra.status){
    a.status = extra.status;
    if(extra.status==='sold' && extra.salePrice!=='' && extra.salePrice!==undefined) a.salePrice = extra.salePrice;
  }
  if(type==='Treatment' && (treatments||[]).includes('Castrating')) return applyCastration(a);
  return false;
}
function saveEvent(evt){
  evt.preventDefault();
  const f = evt.target;
  const modeInput = document.getElementById('event-mode-input');
  const mode = modeInput ? modeInput.value : 'individual';
  const types = mode==='general' ? [] : eventTypesChecked();

  if(mode==='general'){
    const title = f.generalTitle.value.trim();
    if(!title){ toast('Say what the event is'); return; }
    state.events.push({ id: uid(), animalId: null, general: true, type: 'General', title, date: f.date.value, notes: f.notes.value.trim(), nextDue: null });
    saveState();
    closeModal();
    render();
    toast(f.date.value > todayStr() ? `Added "${title}" to Upcoming` : `Logged "${title}"`);
    return;
  }

  if(!types.length){ toast('Tick at least one event type'); return; }
  const date = f.date.value;
  const notes = f.notes.value.trim();
  const nextDue = f.nextDue.value || null;
  const vaccines = types.includes('Vaccination') ? selectedVaccines(f) : [];
  const treatments = types.includes('Treatment') ? [...f.querySelectorAll('input[name="treatmentOpts"]:checked')].map(c=>c.value) : [];
  const pregResult = types.includes('Pregnancy Check') ? f.pregResult.value : '';
  const detailsFor = type => ({
    vaccine: type==='Vaccination' ? vaccines.join(', ') : '',
    vaccines: type==='Vaccination' ? vaccines.slice() : [],
    ...(type==='Treatment' && treatments.length ? { treatment: treatments.join(', '), treatments: treatments.slice() } : {}),
    ...(type==='Pregnancy Check' ? { pregResult } : {}),
  });
  let castrated = 0;
  // Pasture move / Status change / sale price
  const movePasture = types.includes('Pasture move') ? f.movePasture.value : '';
  if(types.includes('Pasture move') && !movePasture){ toast('Choose the pasture to move to'); return; }
  const toPasture = movePasture==='__none__' ? '' : movePasture;
  const newStatus = types.includes('Status change') ? f.newStatus.value : '';
  const salePrice = f.eventSalePrice && f.eventSalePrice.value!=='' ? Number(f.eventSalePrice.value) : '';
  const extra = { pasture: toPasture, status: newStatus, salePrice };
  const extraDetails = type => ({
    ...(type==='Pasture move' ? { toPasture, detail: 'to ' + (toPasture || 'no pasture') } : {}),
    ...(type==='Status change' ? { newStatus, detail: statusLabel(newStatus) + (newStatus==='sold' && salePrice!=='' ? ' · $' + Number(salePrice).toLocaleString() : '') } : {}),
    ...(type==='Sale' && salePrice!=='' ? { salePrice, detail: '$' + Number(salePrice).toLocaleString() } : {}),
  });

  if(mode==='group'){
    if(types.includes('Calving')){ toast('Calving must be logged for one animal at a time'); return; }
    const checked = Array.from(f.querySelectorAll('input[name="groupAnimalIds"]:checked')).map(cb=>cb.value);
    if(checked.length===0){ toast('Select at least one animal'); return; }
    const groupPastures = [...new Set(checked.map(id=> ((animalById(id)||{}).pasture||'').trim()))];
    const groupLabel = groupPastures.length===1 ? groupPastures[0] : '';
    if(types.includes('Pasture move')) recordMove(toPasture, checked);
    types.forEach(type=>{
      // One group id per type ties the records together so the log shows each as one group event.
      const groupId = uid();
      checked.forEach(animalId=>{
        const a = animalById(animalId);
        state.events.push({ id: uid(), animalId, type, date, notes, nextDue, ...detailsFor(type), ...extraDetails(type), groupId, groupLabel });
        if(type==='Pregnancy Check') applyPregResult(a, pregResult);
        if(applyEventEffects(a, type, date, treatments, extra)) castrated++;
      });
    });
    saveState();
    closeModal();
    render();
    toast(`Logged ${types.join(' + ')} for ${checked.length} animal${checked.length===1?'':'s'}` + (castrated ? ` · ${castrated} moved to steer` : ''));
    return;
  }

  if(types.includes('Calving')){
    const calfTagId = f.calfTagId.value.trim();
    if(!calfTagId){ toast('Enter the calf\'s RFID'); return; }
    if(!f.calfName.value.trim()){ toast('Enter a name for the calf'); return; }
    if(animalByTag(calfTagId)){ toast('That RFID is already in use'); return; }
    if(!parseBirthWeight(f.calfBirthWeight.value).ok || f.calfBirthWeight.value===''){ toast(`Calf birth weight must be between ${BW_MIN} and ${BW_MAX} lb`); f.calfBirthWeight.focus(); return; }
  }
  const animalId = f.animalId.value;
  const a = animalById(animalId);
  if(types.includes('Pasture move')) recordMove(toPasture, [animalId]);
  types.forEach(type=>{
    state.events.push({ id: uid(), animalId, type, date, notes, nextDue, ...detailsFor(type), ...extraDetails(type), individual: true });
    if(type==='Pregnancy Check') applyPregResult(a, pregResult);
    if(applyEventEffects(a, type, date, treatments, extra)) castrated++;
  });

  const weight = f.weight.value;
  if(weight && a){
    a.weights = a.weights || [];
    a.weights.push({ date, lbs: Number(weight) });
  }
  let calfAdded = false, promotedHeifer = null;
  if(types.includes('Calving') && a){
    const cow = a;
    const calfTagId = f.calfTagId.value.trim();
    const calfSex = f.calfSex.value;
    if(calfTagId){
      const rec = state.breeding.find(b=> b.cowTagId===cow.tagId && !b.actualCalvingDate);
      if(rec){ rec.actualCalvingDate = date; rec.result = 'Bred'; rec.calfTagId = calfTagId; }
      if(cow.status==='active-preg') cow.status = 'active';
      state.animals.push({
        id: uid(), tagId: calfTagId, name: f.calfName.value.trim(), klass: calfSex==='Bull' ? 'Bull Calf' : 'Heifer Calf',
        breed: cow.breed || '', dob: date, yearLetter: letterForDate(date),
        damId: cow.tagId, sireId: rec ? (rec.sireTagId||'') : '',
        status: 'active', pasture: cow.pasture || '', notes: '',
        birthWeight: parseBirthWeight(f.calfBirthWeight.value).value, birthWeightAt: new Date().toISOString(),
        weights: [{ date, lbs: parseBirthWeight(f.calfBirthWeight.value).value }], weanDate: null
      });
      calfAdded = true;
      if(cow.klass==='Heifer') promotedHeifer = displayName(cow);
    }
  }
  saveState();
  closeModal();
  render();
  const what = types.length > 1 ? `${types.join(' + ')} logged` : 'Event logged';
  toast(calfAdded ? (promotedHeifer ? `Calf added — ${promotedHeifer} moved from Heifers to Cows` : 'Event logged and calf added to the herd')
    : castrated ? `${what} — ${displayName(a)} is now a ${a.klass}` : what);
}

/* ---------- Breeding modal ---------- */
function openBreedingModal(editId, presetCowTagId){
  const editing = editId ? state.breeding.find(b=>b.id===editId) : null;
  const b = editing || { id:uid(), cowTagId:presetCowTagId||'', method:'Natural', sireTagIds:[], sireOther:'', sireTagId:'', breedingDate:todayStr(), result:'Pending', actualCalvingDate:'', calfTagId:'' };
  const cows = state.animals.filter(a=>isActive(a) && (a.klass==='Cow' || a.klass==='Heifer')).sort(byName);
  const activeBulls = state.animals.filter(a=>a.klass==='Bull' && isActive(a)).sort(byName);
  const preSelectedBulls = new Set(b.sireTagIds || []);
  let otherValue = b.sireOther || '';
  if((!b.sireTagIds || b.sireTagIds.length===0) && !otherValue && b.sireTagId){
    otherValue = b.sireTagId;
  }
  const excludeRecordId = editing ? b.id : null;
  function bullUnavailable(tagId){
    return state.breeding.some(rec=> rec.id!==excludeRecordId && !rec.actualCalvingDate && (rec.sireTagIds||[]).includes(tagId));
  }

  const bullsField = activeBulls.length===0
    ? `<p class="hint" style="margin:0 0 8px;">No active bulls on file yet — add one from the Animals tab, or note the sire below.</p>`
    : `<div class="checkbox-list">
        ${activeBulls.map(bull=>{
          const checked = preSelectedBulls.has(bull.tagId);
          const unavailable = !checked && bullUnavailable(bull.tagId);
          return `<label class="checkbox-row ${unavailable?'disabled':''}">
            <input type="checkbox" name="sireTagIds" value="${escapeHtml(bull.tagId)}" ${checked?'checked':''} ${unavailable?'disabled':''}>
            ${eartag(bull)}${semenBadge(bull)}
            ${unavailable? `<span class="muted" style="font-size:11px;">— already turned out</span>` : ''}
          </label>`;
        }).join('')}
      </div>`;

  const individualBlock = `
    <div class="field" id="individual-cow-block">
      <label>Cow / heifer *</label>
      <select name="cowTagId" id="cowTagId-input" required>
        <option value="">— Select —</option>
        ${b.cowTagId && !cows.some(c=>c.tagId===b.cowTagId) ? `<option value="${escapeHtml(b.cowTagId)}" selected>Not in herd</option>` : ''}
        ${cows.map(c=>`<option value="${escapeHtml(c.tagId)}" ${c.tagId===b.cowTagId?'selected':''}>${escapeHtml(displayName(c))} — ${classLabel(c)}</option>`).join('')}
      </select>
    </div>`;

  const groupBlock = editing ? '' : `
    <div class="field" id="group-cow-block" style="display:none;">
      <label>Select cows / heifers *</label>
      <select id="group-pasture-quickselect" onchange="quickSelectPasture(this.value)" style="margin-bottom:8px;">
        <option value="">Quick-select by pasture…</option>
        ${state.pastures.map(p=>`<option value="${escapeHtml(p.name)}">${escapeHtml(p.name)}</option>`).join('')}
      </select>
      <div class="checkbox-list" id="group-cow-checklist">
        ${cows.length===0 ? `<p class="hint" style="margin:4px;">No active cows or heifers on file yet.</p>` :
        cows.map(c=>`<label class="checkbox-row"><input type="checkbox" name="groupCowTagIds" value="${escapeHtml(c.tagId)}" data-pasture="${escapeHtml(c.pasture||'')}"> ${eartag(c)}${c.pasture? ` <span class="muted" style="font-size:11px;">— ${escapeHtml(c.pasture)}</span>`:''}</label>`).join('')}
      </div>
    </div>`;

  const perAnimalFields = editing ? `
      <div class="field-row">
        <div class="field"><label>Pregnancy check result</label>
          <select name="result">
            <option ${b.result==='Pending'?'selected':''}>Pending</option>
            <option ${b.result==='Bred'?'selected':''}>Bred</option>
            <option ${b.result==='Open'?'selected':''}>Open</option>
          </select>
        </div>
        <div class="field"><label>Actual calving date</label><input type="date" name="actualCalvingDate" value="${b.actualCalvingDate||''}"></div>
      </div>
      <div class="field"><label>Calf RFID (if born)</label><input type="text" name="calfTagId" value="${escapeHtml(b.calfTagId)}" placeholder="RFID assigned to the calf" autocomplete="off"></div>` : `
      <p class="hint">Pregnancy check, calving, and calf RFID are tracked per animal — you'll set those from each record once added.</p>`;

  const body = `
    <form onsubmit="saveBreeding(event, '${b.id}', ${editing?'true':'false'})">
      <input type="hidden" id="breeding-mode-input" value="individual">
      <div class="field">
        <label>Record for</label>
        ${editing ? `<p class="hint" style="margin:0;">Editing a single record.</p>` : `
        <div class="chip-toggle">
          <button type="button" class="chip active" id="mode-individual-btn" onclick="setBreedingMode('individual')">Individual animal</button>
          <button type="button" class="chip" id="mode-group-btn" onclick="setBreedingMode('group')">Group / pasture</button>
        </div>`}
      </div>
      ${individualBlock}
      ${groupBlock}
      <div class="field"><label>Method</label>
        <select name="method">
          <option ${b.method==='Natural'?'selected':''}>Natural</option>
          <option ${b.method==='AI'?'selected':''}>AI</option>
        </select>
      </div>
      <div class="field">
        <label>Bull(s) turned out</label>
        ${bullsField}
        <p class="hint">Bulls already on an open reproduction record (no calving logged yet) are greyed out so they don't get double-booked.</p>
      </div>
      <div class="field"><label>Other sire (AI / not in herd)</label><input type="text" name="sireOther" value="${escapeHtml(otherValue)}" placeholder="e.g. AI — semen ID"></div>
      <div class="field"><label>Breeding date *</label><input type="date" name="breedingDate" required value="${b.breedingDate}"></div>
      ${perAnimalFields}
      <p class="hint">Expected calving date is calculated automatically: breeding date + ${GESTATION_DAYS} days.</p>
      <div class="modal-actions">
        ${editing? `<button type="button" class="btn danger" style="margin-right:auto;" onclick="deleteBreeding('${b.id}')">Delete</button>`:''}
        <button type="button" class="btn ghost" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn rust">${editing?'Save changes':'Add record'}</button>
      </div>
    </form>
  `;
  document.getElementById('modal-root').innerHTML = modalShell(editing?'Edit reproduction record':'Add reproduction record', body);
}
function setBreedingMode(mode){
  const indivBtn = document.getElementById('mode-individual-btn');
  const groupBtn = document.getElementById('mode-group-btn');
  if(indivBtn) indivBtn.classList.toggle('active', mode==='individual');
  if(groupBtn) groupBtn.classList.toggle('active', mode==='group');
  const indivBlock = document.getElementById('individual-cow-block');
  const groupBlock = document.getElementById('group-cow-block');
  if(indivBlock) indivBlock.style.display = mode==='individual' ? 'block' : 'none';
  if(groupBlock) groupBlock.style.display = mode==='group' ? 'block' : 'none';
  const cowInput = document.getElementById('cowTagId-input');
  if(cowInput) cowInput.required = (mode==='individual');
  const modeInput = document.getElementById('breeding-mode-input');
  if(modeInput) modeInput.value = mode;
}
function quickSelectPasture(name){
  if(!name) return;
  const boxes = document.querySelectorAll('#group-cow-checklist input[type=checkbox]');
  boxes.forEach(cb=>{ if(cb.dataset.pasture === name) cb.checked = true; });
}
function saveBreeding(evt, id, editing){
  evt.preventDefault();
  const f = evt.target;
  const modeInput = document.getElementById('breeding-mode-input');
  const mode = modeInput ? modeInput.value : 'individual';
  const sireTagIds = Array.from(f.querySelectorAll('input[name="sireTagIds"]:checked')).map(cb=>cb.value);
  const sireOther = f.sireOther.value.trim();
  const method = f.method.value;
  const breedingDate = f.breedingDate.value;
  const sireTagId = [...sireTagIds, sireOther].filter(Boolean).join(', ');

  if(!editing && mode==='group'){
    const checked = Array.from(f.querySelectorAll('input[name="groupCowTagIds"]:checked')).map(cb=>cb.value);
    if(checked.length===0){ toast('Select at least one cow or heifer'); return; }
    checked.forEach(tag=>{
      const rec = {
        id: uid(), cowTagId: tag, method, sireTagIds, sireOther, sireTagId,
        breedingDate, result:'Pending', actualCalvingDate: null, calfTagId: ''
      };
      rec.expectedCalvingDate = addDays(rec.breedingDate, GESTATION_DAYS);
      state.breeding.push(rec);
    });
    saveState();
    closeModal();
    render();
    toast(`Added reproduction records for ${checked.length} animal${checked.length===1?'':'s'}`);
    return;
  }

  const rec = {
    id,
    cowTagId: f.cowTagId.value.trim(),
    method,
    sireTagIds,
    sireOther,
    sireTagId,
    breedingDate,
    result: f.result ? f.result.value : 'Pending',
    actualCalvingDate: f.actualCalvingDate ? (f.actualCalvingDate.value || null) : null,
    calfTagId: f.calfTagId ? f.calfTagId.value.trim() : '',
  };
  rec.expectedCalvingDate = addDays(rec.breedingDate, GESTATION_DAYS);
  if(editing){
    const idx = state.breeding.findIndex(b=>b.id===id);
    state.breeding[idx] = rec;
  } else {
    state.breeding.push(rec);
  }
  saveState();
  closeModal();
  render();
  toast(editing? 'Reproduction record updated' : 'Reproduction record added');
}
function deleteBreeding(id){
  if(!confirm('Delete this reproduction record?')) return;
  state.breeding = state.breeding.filter(b=>b.id!==id);
  saveState();
  closeModal();
  render();
  toast('Record deleted');
}

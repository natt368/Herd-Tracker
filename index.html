  if(!a) return;
  const events = state.events.filter(e=>e.animalId===id).sort((x,y)=> x.date<y.date?1:-1);
  const weights = (a.weights||[]).slice().sort((x,y)=> x.date<y.date?1:-1);
  const calves = state.animals.filter(c=>c.damId===a.tagId);
  const dam = a.damId ? animalByTag(a.damId) : null;

  const html = `<div class="drawer-backdrop" onclick="if(event.target===this) closeDrawer()">
    <div class="drawer">
      <div class="drawer-head">
        <button class="modal-close" onclick="closeDrawer()">✕</button>
      </div>
      ${a.photo ? `<img src="${a.photo}" alt="${escapeHtml(displayName(a))}" class="animal-photo" style="margin-bottom:14px;">` : ''}
      <div style="display:flex; align-items:center; gap:8px;">
        <div class="drawer-title" style="margin:0;">${escapeHtml(displayName(a))}</div>
        <button class="pencil-btn" title="Edit animal details" aria-label="Edit animal details" onclick="closeDrawer(); openAnimalModal(null,'${a.id}')">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>
        </button>
      </div>
      <div class="drawer-sub">${classLabel(a)} · ${a.breed? breedBadge(a.breed) : 'Breed unrecorded'} · ${statusLabel(a.status)}</div>
      <button class="btn rust drawer-log-btn" onclick="closeDrawer(); openEventModal('${a.id}')">+ Log event</button>

      <div class="kv-grid">
        <div class="kv"><div class="k">Date of birth</div><div class="v">${fmtDate(a.dob)}</div></div>
        <div class="kv"><div class="k">Age</div><div class="v">${ageText(a)}${yearFromLetter(a.yearLetter) ? ' <span class="muted" style="font-weight:500;">('+yearFromLetter(a.yearLetter)+')</span>' : ''}</div></div>
        <div class="kv"><div class="k">Year letter</div><div class="v">${escapeHtml(a.yearLetter)||'—'}</div></div>
        ${a.visualTag ? `<div class="kv"><div class="k">Visual tag</div><div class="v">${escapeHtml(a.visualTag)}</div></div>` : ''}
        <div class="kv"><div class="k">Dam</div><div class="v">${dam? escapeHtml(displayName(dam)) : (a.damId ? 'Not in herd <span class="muted" style="font-weight:500;">('+escapeHtml(a.damId)+')</span>' : '—')}</div></div>
        <div class="kv"><div class="k">Sire</div><div class="v">${escapeHtml(nameForTag(a.sireId))}</div></div>
        <div class="kv"><div class="k">Pasture</div><div class="v">${escapeHtml(a.pasture)||'—'}</div></div>
        ${a.klass==='Bull' ? `<div class="kv"><div class="k">Scrotal circ.</div><div class="v">${a.scrotalCm!==undefined && a.scrotalCm!=='' ? escapeHtml(a.scrotalCm)+' cm' : '—'}</div></div>
        <div class="kv"><div class="k">Semen check</div><div class="v" style="color:${a.semenCheck==='Failed'?'var(--danger)':a.semenCheck==='Passed'?'var(--pasture-dark)':'inherit'};">${a.semenCheck ? escapeHtml(a.semenCheck)+(a.semenCheckDate? ' · '+fmtDate(a.semenCheckDate):'') : 'Not tested'}</div></div>` : ''}
        ${a.klass==='Bull' ? `<div class="kv"><div class="k">Purchase price</div><div class="v">${a.purchasePrice!==undefined && a.purchasePrice!=='' ? '$'+Number(a.purchasePrice).toLocaleString(undefined,{minimumFractionDigits:2, maximumFractionDigits:2}) : '—'}</div></div>
        <div class="kv"><div class="k">Purchased from</div><div class="v">${escapeHtml(a.purchasedFrom)||'—'}${a.purchaseDate? ' · '+fmtDate(a.purchaseDate):''}</div></div>` : ''}
        <div class="kv"><div class="k">Birth weight</div><div class="v">${(bw=> bw.recorded ? bw.lbs+' lb' : bw.lbs+' lb <span class="muted" style="font-weight:500;">(default)</span>')(birthWeightOf(a))}</div></div>
        <div class="kv"><div class="k">Latest weight</div><div class="v">${latestWeight(a)? latestWeight(a).lbs+' lb':'—'}</div></div>

      </div>
      ${a.notes? `<div class="kv"><div class="k">Notes</div><div class="v" style="font-weight:400;">${escapeHtml(a.notes)}</div></div>`:''}

            <td>${f.wean ? `<b>${f.wean.lbs}</b>` : (c.weanDate ? '<span class="muted">not weighed</span>' : '<span class="muted">at side</span>')}</td>
            <td>${f.latest ? f.latest.lbs : '—'}</td>
          </tr>`).join('')}</tbody>
        </table>
        <p class="hint" style="margin:6px 0 0;">Weights in lb.${p.facts.some(x=> x.f.birth && x.f.birth.estimated) ? ' * no birth weight recorded — the 90 lb default is used for gain.' : ''}</p>`)(damPerformance(a))}
      </div>`:''}

      <div class="drawer-section">
        <h4>Weight history</h4>
        ${weights.length===0? `<p class="hint">No weights recorded yet.</p>` :
          weights.map(w=>`<div class="mini-row"><span class="t">${w.lbs} lb</span><span class="d">${fmtDate(w.date)}</span></div>`).join('')}
      </div>

      <div class="drawer-section">
        <h4>Event history</h4>
        ${events.length===0? `<p class="hint">No events logged yet.</p>` :
          events.map(e=>`<div class="mini-row"><span class="t">${escapeHtml(e.type)}${e.vaccine? ' — '+escapeHtml(e.vaccine):''}${e.treatment? ' — '+escapeHtml(e.treatment):''}${e.detail? ' — '+escapeHtml(e.detail):''}${e.pregResult? ' — '+escapeHtml(e.pregResult):''}${e.notes? ' — '+escapeHtml(e.notes):''}</span><span class="d">${fmtDate(e.date)}</span></div>`).join('')}
      </div>
    </div>
  </div>`;
  document.getElementById('drawer-root').innerHTML = html;
}

/* =========================================================
   GLOBAL SEARCH (available on every tab)
========================================================= */
function handleGlobalSearchInput(q){
  const box = document.getElementById('global-search-results');
  if(!box) return;
  const query = (q||'').trim().toLowerCase();
  if(!query){ box.style.display='none'; box.innerHTML=''; return; }
  const matches = state.animals.filter(a=> animalMatchesSearch(a, query)).slice(0,8);
  if(matches.length===0){
    box.innerHTML = `<div class="global-search-empty">No animals match "${escapeHtml(q)}"</div>`;
  } else {
    box.innerHTML = matches.map(a=>{
      const pasture = (a.pasture||'').trim();
      return `<div class="global-search-row" onclick="selectGlobalSearchResult('${a.id}')">
        <div style="display:flex; align-items:center; gap:10px; flex:1; min-width:0;">
          ${eartag(a)}
          <span class="gs-meta">${classLabel(a)}${a.breed? ' · '+escapeHtml(a.breed):''}</span>
        </div>
        ${a.status!=="active"? `<span class="status-tag">${statusLabel(a.status)}</span>`:''}
        <span style="font-size:12px; font-weight:600; white-space:nowrap; color:${pasture?'var(--pasture-dark)':'var(--ink-faint)'};" title="Pasture">📍 ${pasture ? escapeHtml(pasture) : 'No pasture'}</span>
      </div>`;
    }).join('');
  }
  box.style.display = 'block';
}
function selectGlobalSearchResult(id){
  const box = document.getElementById('global-search-results');
  const input = document.getElementById('global-search-input');
  if(box){ box.style.display='none'; box.innerHTML=''; }
  if(input) input.value='';
  openDrawer(id);
}
document.addEventListener('click', function(e){
  const wrap = document.getElementById('global-search-wrap');
  const box = document.getElementById('global-search-results');
  if(!wrap || !box) return;
  if(!wrap.contains(e.target)){
    box.style.display='none';
  }
});
document.addEventListener('keydown', function(e){
  if(e.key==='Escape'){
    const box = document.getElementById('global-search-results');
    if(box) box.style.display='none';
  }
});

/* =========================================================
   INIT
========================================================= */
async function init(){
  render();
  await loadState();
  if(promoteHeifersWithCalves().length) saveState();
  render();
  refreshBadge();
  // Google sign-in loads early so Connect and the sign-in renewal can open their window straight from a click.
  if(clientId()) loadGis().catch(()=>{});
  if(driveSetUp()){
    if(drive.loadOnOpen) syncNow('open');
    else if(localChangedSinceSync()) scheduleBackup();
  }
}
init();
// Offline: once opened online, the app opens and works without internet (sw.js).
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
